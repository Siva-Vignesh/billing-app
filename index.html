<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing App</title>
    <style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: #eef2ff;
  --success: #059669;
  --success-hover: #047857;
  --danger: #e11d48;
  --warning: #d97706;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.18);
  --radius: 12px;
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  color: var(--text);
}

* {
  box-sizing: border-box;
}

/* ---------- Themes ---------- */
[data-theme='dark'] {
  --bg: #0b1220;
  --surface: #111827;
  --surface-2: #0f172a;
  --border: #1f2937;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --primary: #6366f1;
  --primary-hover: #818cf8;
  --primary-soft: rgba(99, 102, 241, 0.18);
}

[data-theme='ocean'] {
  --primary: #0891b2;
  --primary-hover: #0e7490;
  --primary-soft: #cffafe;
}

[data-theme='forest'] {
  --primary: #059669;
  --primary-hover: #047857;
  --primary-soft: #d1fae5;
}

[data-theme='sunset'] {
  --primary: #ea580c;
  --primary-hover: #c2410c;
  --primary-soft: #ffedd5;
}

/* ---------- Theme picker ---------- */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}

.theme-swatch {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
}

.theme-swatch:hover {
  border-color: var(--primary);
}

.theme-swatch.active {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-soft);
}

.theme-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex-shrink: 0;
}

body {
  margin: 0;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
}

input,
select {
  font-family: inherit;
  font-size: 14px;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  width: 100%;
}

input:focus,
select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

/* ---------- Shell ---------- */
.app-shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  overflow: hidden;
  transition: grid-template-columns 0.18s ease;
}

.app-shell.collapsed {
  grid-template-columns: 68px 1fr;
}

.sidebar {
  background: #0f172a;
  color: #cbd5e1;
  display: flex;
  flex-direction: column;
  padding: 14px 14px;
  gap: 6px;
}

.sidebar-toggle {
  margin-left: auto;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 6px;
  line-height: 1;
}

.sidebar-toggle:hover {
  background: rgba(148, 163, 184, 0.12);
  color: #fff;
}

.app-shell.collapsed .sidebar-toggle {
  margin-left: 0;
}

.app-shell.collapsed .brand {
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 6px 0 18px;
}

.app-shell.collapsed .brand-text,
.app-shell.collapsed .nav-label,
.app-shell.collapsed .sidebar-foot,
.app-shell.collapsed .tab-count {
  display: none;
}

.app-shell.collapsed .nav-item {
  justify-content: center;
  gap: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 18px;
}

.brand-logo {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: grid;
  place-items: center;
  font-size: 20px;
  color: #fff;
  flex-shrink: 0;
}

.brand-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
}

.brand-sub {
  font-size: 11px;
  color: #94a3b8;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: none;
  background: transparent;
  color: #cbd5e1;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  width: 100%;
  transition: background 0.15s, color 0.15s;
}

.nav-item:hover {
  background: rgba(148, 163, 184, 0.12);
  color: #fff;
}

.nav-item.active {
  background: var(--primary);
  color: #fff;
}

.nav-icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
}

.sidebar-foot {
  margin-top: auto;
  font-size: 11px;
  color: #64748b;
  padding: 10px 8px 0;
  border-top: 1px solid rgba(148, 163, 184, 0.15);
}

/* ---------- Main ---------- */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.topbar h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

.topbar .sub {
  font-size: 12px;
  color: var(--muted);
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.hw-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  background: var(--surface-2);
  max-width: 200px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.hw-chip .hw-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #94a3b8;
  flex-shrink: 0;
}

/* Connected & ready */
.hw-chip.ok {
  color: var(--success);
  border-color: #a7f3d0;
  background: #ecfdf5;
}

.hw-chip.ok .hw-dot {
  background: var(--success);
}

/* Connected but has a problem */
.hw-chip.error {
  color: var(--danger);
  border-color: #fecdd3;
  background: #fff1f2;
}

.hw-chip.error .hw-dot {
  background: var(--danger);
}

/* Not connected */
.hw-chip.off {
  color: var(--muted);
  background: var(--surface-2);
}

.hw-chip.off .hw-dot {
  background: #cbd5e1;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 22px;
}

/* ---------- Billing layout ---------- */
.billing-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 18px;
  align-items: start;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.panel-head h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}

.panel-body {
  padding: 16px;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- Search ---------- */
.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

/* ---------- Product grid ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}

.product-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  text-align: left;
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}

.product-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  box-shadow: var(--shadow);
}

.product-card .p-name {
  font-weight: 600;
  font-size: 13.5px;
}

.product-card .p-price {
  font-weight: 700;
  color: var(--primary);
}

.badge {
  display: inline-block;
  font-size: 10.5px;
  padding: 2px 7px;
  border-radius: 999px;
  background: #ecfdf5;
  color: var(--success);
  width: fit-content;
}

.badge.low {
  background: #fff7ed;
  color: var(--warning);
}

.badge.cat {
  background: var(--primary-soft);
  color: var(--primary);
}

.badge.cat.unknown {
  background: #f1f5f9;
  color: var(--muted);
}

/* ---------- Cart ---------- */
.cart-table {
  width: 100%;
  border-collapse: collapse;
}

.cart-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 6px 6px;
  border-bottom: 1px solid var(--border);
}

.cart-table td {
  padding: 9px 6px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  vertical-align: middle;
}

.cart-empty {
  text-align: center;
  color: var(--muted);
  padding: 26px 0;
  font-size: 13px;
}

.qty-control {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.qty-control button {
  width: 26px;
  height: 28px;
  border: none;
  background: var(--surface-2);
  font-size: 15px;
  color: var(--text);
}

.qty-control button:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.qty-control span {
  min-width: 30px;
  text-align: center;
  font-size: 13px;
}

.icon-btn {
  border: none;
  background: transparent;
  color: var(--danger);
  font-size: 16px;
  border-radius: 6px;
  padding: 4px 7px;
}

.icon-btn:hover {
  background: #ffe4e6;
}

/* ---------- Totals ---------- */
.summary {
  margin-top: 14px;
  border-top: 1px dashed var(--border);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  color: var(--muted);
}

.summary-row.grand {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 2px;
}

/* ---------- Segmented control ---------- */
.segmented {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}

.segmented button.active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: var(--shadow);
}

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  transition: background 0.15s, transform 0.05s;
}

.btn:hover {
  background: var(--surface-2);
}

.btn:active {
  transform: translateY(1px);
}

.btn.primary {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.btn.primary:hover {
  background: var(--primary-hover);
}

.btn.success {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}

.btn.success:hover {
  background: var(--success-hover);
}

.btn.block {
  width: 100%;
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

/* ---------- Field ---------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}

.field .hint {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}

.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* ---------- Modal ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  display: grid;
  place-items: center;
  z-index: 50;
}

.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 24px;
  width: 340px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.modal h3 {
  margin: 0 0 4px;
}

.modal .qr-amount {
  font-size: 24px;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 14px;
}

.modal img {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px;
  background: #fff;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;
  background: #0f172a;
  color: #fff;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  z-index: 60;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from {
    transform: translateY(10px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.muted {
  color: var(--muted);
}

#qr-scan-region {
  border-radius: 10px;
  overflow: hidden;
}

/* ---------- Settings ---------- */
.settings-wrap {
  max-width: 720px;
}

.settings-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 18px;
  align-items: start;
  max-width: 1100px;
}

.settings-col {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* Masonry: panels flow into as many columns as the width allows */
.settings-masonry {
  column-width: 330px;
  column-gap: 18px;
}

.settings-masonry > .panel {
  width: 100%;
  margin-bottom: 18px;
  break-inside: avoid;
}

@media (max-width: 900px) {
  .settings-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- Bill tabs ---------- */
.bill-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  align-items: center;
}

.bill-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.bill-tab.active {
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: var(--shadow);
}

.bill-tab .close {
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
}

.bill-tab .close:hover {
  color: var(--danger);
}

.tab-count {
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 999px;
}

.tab-add {
  padding: 8px 12px;
  border: 1px dashed var(--border);
  border-radius: 9px;
  background: transparent;
  color: var(--primary);
  font-weight: 600;
  font-size: 13px;
}

.tab-add:hover {
  background: var(--primary-soft);
}

/* ---------- Billing split (items left, details right) ---------- */
.bill-split {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 18px;
  align-items: start;
}

@media (max-width: 1100px) {
  .bill-split {
    grid-template-columns: 1fr;
  }
}

.bill-details {
  position: sticky;
  top: 0;
}

/* Compact rows so many items fit without scrolling */
.cart-table.compact th,
.cart-table.compact td {
  padding: 4px 6px;
  font-size: 13px;
}

.cart-table.compact .qty-control {
  border-radius: 6px;
}

.cart-table.compact .qty-control button {
  width: 22px;
  height: 22px;
  font-size: 13px;
}

.cart-table.compact .qty-control span {
  min-width: 24px;
  font-size: 12px;
}

/* ---------- Stat cards ---------- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.stat-label {
  font-size: 11.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  margin-top: 6px;
}

/* ---------- Data tables ---------- */
.data-table {
  width: 100%;
  border-collapse: collapse;
}

.data-table th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  padding: 8px;
  border-bottom: 1px solid var(--border);
}

.data-table td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}

.table-actions {
  display: flex;
  gap: 6px;
}

.link-btn {
  border: none;
  background: transparent;
  color: var(--primary);
  font-weight: 600;
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 6px;
}

.link-btn:hover {
  background: var(--primary-soft);
}

.link-btn.danger {
  color: var(--danger);
}

.link-btn.danger:hover {
  background: #ffe4e6;
}

.form-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

/* ---------- Reports ---------- */
.report-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

.period-nav {
  display: flex;
  align-items: center;
  gap: 10px;
}

.period-nav .btn {
  padding: 4px 12px;
  font-size: 16px;
  line-height: 1.2;
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px 5px 12px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
}

.filter-chip button {
  border: none;
  background: transparent;
  color: inherit;
  font-size: 12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
}

.filter-chip button:hover {
  background: var(--surface);
}

.data-table tr.clickable {
  cursor: pointer;
}

.data-table tr.clickable:hover td {
  background: var(--surface-2);
}

.data-table tr.selected td,
.data-table tr.selected:hover td {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
}

.scroll-list {
  max-height: 380px;
  overflow-y: auto;
}

.bar-chart {
  display: flex;
  gap: 4px;
  height: 180px;
}

.bar-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.bar-track {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: flex-end;
}

.bar {
  width: 100%;
  background: var(--primary);
  border-radius: 4px 4px 0 0;
}

.bar-col:hover .bar {
  background: var(--primary-hover);
}

.bar-label {
  height: 14px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
}

/* ---------- Dropdown menu ---------- */
.menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 40;
}

.menu {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 41;
  min-width: 150px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.menu-item {
  text-align: left;
  border: none;
  background: transparent;
  padding: 8px 10px;
  border-radius: 7px;
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
}

.menu-item:hover {
  background: var(--primary-soft);
  color: var(--primary);
}

.menu-item.active {
  background: var(--primary-soft);
  color: var(--primary);
}

/* Type-to-filter combobox */
.combo {
  position: relative;
}

.combo-menu {
  left: 0;
  right: 0;
  min-width: 0;
  max-height: 200px;
  overflow-y: auto;
}

/* ---------- Activation / licensing ---------- */
.activation-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #4f46e5, #8b5cf6);
  padding: 24px;
}

.activation-card {
  width: 380px;
  max-width: 100%;
  background: var(--surface);
  border-radius: 16px;
  padding: 30px 28px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.activation-logo {
  width: 56px;
  height: 56px;
  margin: 0 auto 10px;
  border-radius: 14px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: grid;
  place-items: center;
  font-size: 28px;
}

.activation-card h1 {
  margin: 0 0 8px;
  font-size: 20px;
}

.activation-card .field {
  text-align: left;
}

.activation-warn {
  color: var(--warning);
  font-size: 14px;
}

.activation-error {
  color: var(--danger);
  font-size: 13px;
  margin: 8px 0 0;
}

.activation-card.wide {
  width: 620px;
}

.activation-steps {
  text-align: left;
  font-size: 13px;
  color: var(--muted);
  padding-left: 18px;
  margin: 0 0 14px;
}

.plan-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 16px 0;
}

.plan-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  background: var(--surface-2);
  color: var(--text);
}

.plan-card.selected {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

.plan-icon {
  font-size: 28px;
}

.plan-name {
  font-weight: 800;
  margin-top: 4px;
}

.plan-term {
  font-weight: 600;
  color: var(--primary);
  font-size: 13px;
}

.plan-note {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 4px;
}

.machine-id {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  font-family: Consolas, 'Courier New', monospace;
  font-size: 15px;
  letter-spacing: 0.05em;
}

.upi-qr-upload {
  display: flex;
  align-items: center;
  gap: 14px;
}

.hw-chip.printer-pick {
  max-width: 280px;
  cursor: pointer;
}

.hw-chip.printer-pick select {
  width: auto;
  max-width: 230px;
  padding: 0;
  border: none;
  background: transparent;
  color: inherit;
  font-size: 12px;
  font-weight: 600;
  box-shadow: none;
  cursor: pointer;
  text-overflow: ellipsis;
}

.upi-qr-upload img,
.upi-qr-empty {
  width: 110px;
  height: 110px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  object-fit: contain;
  padding: 4px;
}

.upi-qr-empty {
  display: grid;
  place-items: center;
  border-style: dashed;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 11.5px;
  text-align: center;
}

.plan-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 10px;
  padding: 3px 10px;
  border: none;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  vertical-align: middle;
}

.plan-badge.diamond {
  background: #e0f2fe;
  color: #0369a1;
}

.plan-badge.gold {
  background: #fef3c7;
  color: #b45309;
}

.plan-badge.silver {
  background: #e2e8f0;
  color: #475569;
}

.plan-badge.warn {
  background: #ffe4e6;
  color: var(--danger);
}

  </head>
